    <!-- Schema.org organisation.
         Two jobs here:
           1. Get the logo into search results / knowledge panels.
           2. Teach Google that the Arabic string "نافارا للتسويق الإلكتروني"
              refers to THIS domain. Right now Google resolves "نافارا" to the
              Nissan Navara pickup truck, because no page anywhere connects the
              Arabic name to navaraagency.com.

         Note the bare "نافارا" is intentionally absent from alternateName.
         Nissan + Arabic Wikipedia own that entity and it is not winnable; the
         compound brand names below are.

         sameAs values verified with Omar on 2026-07-28. Keep in sync with
         src/config/links.js — a mismatch between the two weakens the signal. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://navaraagency.com/#organization",
      "name": "Navara",
      "alternateName": [
        "Navara Agency",
        "نافارا ايجنسي",
        "نافارا للتسويق الإلكتروني",
        "شركة نافارا للتسويق الإلكتروني",
        "نافارا للتسويق الرقمي"
      ],
      "url": "https://navaraagency.com",
      "logo": "https://navaraagency.com/nv-icon-512.png",
      "image": "https://navaraagency.com/og-image.png",
      "description": "Egypt and Saudi Arabia's integrated growth marketing agency — strategy, creative, media buying, and analytics under one roof.",
      "knowsLanguage": ["ar", "en"],
      "areaServed": [
        { "@type": "Country", "name": "SA" },
        { "@type": "Country", "name": "EG" }
      ],
      "sameAs": [
        "https://www.linkedin.com/company/navara-agency",
        "https://www.instagram.com/navara_agency",
        "https://www.facebook.com/navara.agency",
        "https://www.tiktok.com/@navara_agency",
        "https://x.com/Navara_Agency"
      ]
    }
    </script>
